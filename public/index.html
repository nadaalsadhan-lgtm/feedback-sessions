<!-- ==========================================================
     KABi Onboarding Ratings Panel  (standalone drop-in)
     Paste this block anywhere inside your dashboard <body>.
     It fetches /api/ratings and renders a KABi-styled summary.
     No dependencies. Safe to paste as-is.
     ========================================================== -->
<div id="kabi-onboarding-panel" style="font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:24px auto;">
  <div style="background:#216AB1;color:#fff;padding:16px 20px;border-radius:10px 10px 0 0;font-size:17px;font-weight:bold;">
    Onboarding Ratings
  </div>
  <div id="kabi-onb-body" style="background:#fff;border:1px solid #e6e9ee;border-top:none;border-radius:0 0 10px 10px;padding:20px;">
    <div id="kabi-onb-loading" style="color:#555;">Loading ratings…</div>

    <!-- summary cards -->
    <div id="kabi-onb-cards" style="display:none;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
      <div style="flex:1;min-width:120px;background:#0EB3AE;color:#fff;border-radius:10px;padding:16px;text-align:center;">
        <div style="font-size:28px;font-weight:bold;" id="kabi-onb-easy">0</div>
        <div style="font-size:13px;opacity:.9;">🙂 Easy</div>
      </div>
      <div style="flex:1;min-width:120px;background:#1EAFD9;color:#fff;border-radius:10px;padding:16px;text-align:center;">
        <div style="font-size:28px;font-weight:bold;" id="kabi-onb-neutral">0</div>
        <div style="font-size:13px;opacity:.9;">😐 Neutral</div>
      </div>
      <div style="flex:1;min-width:120px;background:#9B81BC;color:#fff;border-radius:10px;padding:16px;text-align:center;">
        <div style="font-size:28px;font-weight:bold;" id="kabi-onb-difficult">0</div>
        <div style="font-size:13px;opacity:.9;">🙁 Difficult</div>
      </div>
      <div style="flex:1;min-width:120px;background:#3D3185;color:#fff;border-radius:10px;padding:16px;text-align:center;">
        <div style="font-size:28px;font-weight:bold;" id="kabi-onb-avg">–</div>
        <div style="font-size:13px;opacity:.9;">Avg (1–3)</div>
      </div>
    </div>

    <!-- per-client table -->
    <table id="kabi-onb-table" style="display:none;width:100%;border-collapse:collapse;font-size:14px;">
      <thead>
        <tr style="background:#216AB1;color:#fff;text-align:left;">
          <th style="padding:10px;">Client</th>
          <th style="padding:10px;">Product</th>
          <th style="padding:10px;">Latest Score</th>
          <th style="padding:10px;">When</th>
        </tr>
      </thead>
      <tbody id="kabi-onb-rows"></tbody>
    </table>

    <div id="kabi-onb-empty" style="display:none;color:#777;">No ratings recorded yet.</div>
  </div>
</div>

<script>
(function () {
  var API = '/api/ratings'; // same-origin; works when dashboard is on feedback-sessions.vercel.app
  var scoreColor = { easy:'#0EB3AE', neutral:'#1EAFD9', difficult:'#9B81BC' };
  var scoreEmoji = { easy:'🙂 Easy', neutral:'😐 Neutral', difficult:'🙁 Difficult' };

  fetch(API)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var loading = document.getElementById('kabi-onb-loading');
      loading.style.display = 'none';

      var ratings = (data && data.ratings) ? data.ratings : [];
      if (!ratings.length) {
        document.getElementById('kabi-onb-empty').style.display = 'block';
        return;
      }

      // counts across all ratings
      var counts = { easy:0, neutral:0, difficult:0 };
      var sum = 0, n = 0;
      // keep only the latest rating per client for the table
      var latestByClient = {};
      for (var i = 0; i < ratings.length; i++) {
        var rt = ratings[i];
        if (counts[rt.score] !== undefined) counts[rt.score]++;
        if (typeof rt.value === 'number') { sum += rt.value; n++; }
        // ratings are newest-first, so first time we see a client = latest
        if (!latestByClient[rt.client]) latestByClient[rt.client] = rt;
      }

      document.getElementById('kabi-onb-easy').textContent = counts.easy;
      document.getElementById('kabi-onb-neutral').textContent = counts.neutral;
      document.getElementById('kabi-onb-difficult').textContent = counts.difficult;
      document.getElementById('kabi-onb-avg').textContent = n ? (sum / n).toFixed(2) : '–';
      document.getElementById('kabi-onb-cards').style.display = 'flex';

      // build table rows
      var rows = '';
      Object.keys(latestByClient).forEach(function (client) {
        var rt = latestByClient[client];
        var when = rt.ratedAt ? new Date(rt.ratedAt).toLocaleString() : '';
        rows += '<tr style="border-bottom:1px solid #eef1f4;">'
          + '<td style="padding:10px;font-weight:bold;">' + client + '</td>'
          + '<td style="padding:10px;">' + (rt.product || '') + '</td>'
          + '<td style="padding:10px;"><span style="background:' + (scoreColor[rt.score]||'#999')
              + ';color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;">'
              + (scoreEmoji[rt.score] || rt.score) + '</span></td>'
          + '<td style="padding:10px;color:#666;">' + when + '</td>'
          + '</tr>';
      });
      document.getElementById('kabi-onb-rows').innerHTML = rows;
      document.getElementById('kabi-onb-table').style.display = 'table';
    })
    .catch(function (err) {
      var loading = document.getElementById('kabi-onb-loading');
      if (loading) loading.textContent = 'Could not load ratings: ' + err.message;
    });
})();
</script>
